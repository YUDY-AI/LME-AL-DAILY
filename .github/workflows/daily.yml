name: Daily update

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update data
        run: python update.py
      - name: Commit changes
        run: |
          git config user.name  "lme-bot"
          git config user.email "lme-bot@users.noreply.github.com"
          git add index.html snapshots
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git push
          fi
