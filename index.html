<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LME AL DAILY｜Peter 鋁金屬價格追蹤</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f172a;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}

.container { max-width: 720px; width: 100%; }

/* ── Header ── */
.brand {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #64748b;
  text-transform: uppercase;
  margin-bottom: 16px;
}
h1 {
  font-size: clamp(40px, 8vw, 72px);
  font-weight: 800;
  letter-spacing: -2px;
  line-height: 1;
  color: #f1f5f9;
  margin-bottom: 8px;
}
h1 span { color: #B59565; }
.subtitle {
  font-size: 15px;
  color: #64748b;
  margin-bottom: 28px;
  font-weight: 400;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 40px;
}
.tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  background: rgba(181,149,101,0.12);
  border: 1px solid rgba(181,149,101,0.25);
  color: #B59565;
  border-radius: 20px;
  padding: 5px 12px;
}

/* ── Stats ── */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 40px;
}
.stat-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 18px 20px;
  text-align: center;
}
.stat-val {
  font-size: 22px;
  font-weight: 700;
  color: #f1f5f9;
  font-variant-numeric: tabular-nums;
}
.stat-lbl {
  font-size: 11px;
  color: #475569;
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── Entry button ── */
.entry {
  display: block;
  background: #B59565;
  color: #0f172a;
  text-align: center;
  text-decoration: none;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  border-radius: 12px;
  padding: 18px 32px;
  transition: background 0.2s, transform 0.1s;
  margin-bottom: 16px;
}
.entry:hover { background: #c8aa7a; transform: translateY(-1px); }
.entry-sub {
  text-align: center;
  font-size: 12px;
  color: #475569;
}

/* ── Divider ── */
.divider {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.07);
  margin: 48px 0 32px;
}

/* ── Footer ── */
.footer {
  text-align: center;
  font-size: 11px;
  color: #334155;
  letter-spacing: 0.5px;
}

@media (max-width: 480px) {
  .stats { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="container">

  <div class="brand">LME · Aluminium · Daily</div>
  <h1>LME AL<br><span>DAILY</span></h1>
  <div class="subtitle">Peter 專屬鋁金屬行情追蹤｜每日自動更新</div>

  <div class="tags">
    <span class="tag">LME 鋁現金結算</span>
    <span class="tag">3M 遠期</span>
    <span class="tag">LME 庫存</span>
    <span class="tag">負價差警示</span>
    <span class="tag">台指期夜盤</span>
    <span class="tag">月均價分析</span>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-val" id="latestDate">—</div>
      <div class="stat-lbl">最新資料日期</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="latestPrice">—</div>
      <div class="stat-lbl">最新現金價 (USD/MT)</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">每天</div>
      <div class="stat-lbl">自動更新頻率</div>
    </div>
  </div>

  <a class="entry" href="dashboard.html">📊 開啟價格 Dashboard</a>
  <div class="entry-sub">每日 07:30 更新 · 08:00 推送</div>

  <hr class="divider">
  <div class="footer">LME AL DAILY · Peter 專屬情報 · 每個工作日自動更新</div>

</div>

<script>
// 從 dashboard.html 抓取最新日期與價格（GitHub Pages 上同 origin）
async function loadStats() {
  try {
    const res = await fetch('dashboard.html');
    const text = await res.text();
    // 找最新日期
    const dateM = text.match(/date:"(\d{4}-\d{2}-\d{2})"/);
    if (dateM) document.getElementById('latestDate').textContent = dateM[1];
    // 找最新 cash 價
    const priceM = text.match(/cash:([\d.]+)/);
    if (priceM) document.getElementById('latestPrice').textContent = '$' + Number(priceM[1]).toLocaleString();
  } catch(e) {}
}
loadStats();
</script>
</body>
</html>
